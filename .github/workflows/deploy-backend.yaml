name: Deploy Backend
on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - ".github/workflows/deploy-backend.yaml"

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend/api
    environment:
      name: prod
      url: https://open-ice-api.fly.dev
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup flyctl
        uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Deploy to Fly.io
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: flyctl deploy --remote-only

  publish-release:
    needs: deploy
    if: ${{ success() }}
    uses: ./.github/workflows/publish-prod-release.yaml
    permissions:
      contents: write
    with:
      service_name: Backend API
      service_url: https://open-ice-api.fly.dev
      deploy_notes: Fly.io production API deploy from backend/api using flyctl deploy --remote-only.
